services:
  meridian:
    build: .
    ports:
      - "${HOST_PORT:-3001}:3001"
    environment:
      PORT: 3001
      PUBLIC_PORT: 3001
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      DB_PATH: /app/data/meridian.sqlite
    volumes:
      - meridian-data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  meridian-data:
